# devices/pclm10/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device pclm10
	title       OPPO Reno Ace
	vendor      OPPO
	soc         sm8150
	defconfig   pclm10_defconfig
	firmware    pull-firmware.sh
	maintainer  renny
	# Wi-Fi update 2026-11-05: notes/wifi.md section 5 M15-M17 supersedes
	# the historical M13/M14 interpretation in the wifi status below.
	# M16 attached absolute IDs 170/172, but DT SPI indices need +32:
	# the intended receive IDs are 202/204. Zero counts on the wrong lines
	# do NOT prove a bidirectional doorbell failure. M17 changes only IDs.
	# M16 SCM IO is offered; -2 means invalid argument. Full-log peak 48.2 C.
	# M17 logs/093136-run.log: corrected IDs deliver GLINK 2 / SMP2P 1
	# interrupts (dispatcher and handler agree). SLPI-to-AP WORKS. Host
	# queue remains unread (tail 0, head 48); IPCRTR never opened. Peak 47.5 C.
	# M18 logs/094426-run.log: host restart-ack flags 0 -> 0x2 verified,
	# but tail 0/head 48 and IPCRTR closed remain. Ack alone is insufficient.
	# Same receive counts 2/1, peak 48.2 C, normal return; no flashing.
	# M19 logs/095720-run.log: PAS_SHUTDOWN transport/firmware 0/0;
	# reload and ack succeed, still no host FIFO consumption. Peak 47.8 C.
	# M20 logs/101014-run.log: NEW watchdog INTID 526 dispatch/handler
	# delta 0 -> 1 after shutdown baseline. SFR unchanged, fatal/ready 0.
	# Do not infer DSP health from old SFR or zero fatal bit. Peak 47.8 C.
	status      display     partial   UEFI's framebuffer, through the loader (to be checked)
	status      gpu         works     the Adreno 640 draws and the system composites with it. The key was the SMMU match mask: the core's stream must carry the device tree's own value, gfx3d_user = stream 0 with mask 0x401 (the GMU keeps 0x400); with that the CP takes commands at once, CP_ME_INIT completes and the core writes our memory on command (logs/013009-run.log). Step 22 fills a test picture through the CP — pixels verified band by band — and it reaches the panel, seen by the eye (logs/013516-run.log). With adreno_keep=1 the GPU stays on, the service HakiosGPU hands it to programs through the msm interface, and backboardd's CoreAnimation draws with it: an OpenGL ES 3.2 context (Mesa 25.0.7, renderer "Adreno 7c+ Gen 3", freedreno on our hardware), its first shaders, IOSurfaces attached as textures, two frames drawn (136 and 65 GL calls) and submitted (submissions 1-2, the ring read pointer following), both swapped to the panel, no CP fault and no crash (logs/014918-run.log; the library is built with GL=1, which the earlier image lacked, logs/014041-run.log). What is not verified: sustained animation (after the first two frames the scene was static with nobody touching), GPU frequency scaling and idle collapse, recovery from a lost device, long runs (notes/remaining-hardware.md)
	status      buttons     works     power on the PM8150's power-on block, both volume keys on that chip's GPIO controller; the kernel sees every press and backboardd receives the iOS volume codes (pon=1, logs/100547-run.log)
	status      cpu         works     seven cores for the kernel (the eighth is the loader's own, cpus=8 bootcpu=7; logs/010909-run.log), all three clock groups at the top rows of the table the firmware filled, 1785, 2419 and 2956 MHz (cpufreq=1 epss_hw=1 epss0/1/2), and the memory-bandwidth vote through RPMh (cmdb=0x85f20000, logs/015951-run.log): a loop on the prime core runs 3.6x faster (logs/013949-run.log). The frame rate is not the clock's to give: 1080x2400 is drawn by one software thread until the GPU comes (notes/cpu.md)
	status      battery     partial   the SMB5 charger and the pack voltage are read through the PMIC's own gauge (smb5=1; logs/092331-run.log: 4.2805 V, taking charge, and the UI shows SOC=97% from it); the pack's own gauge (BQ27541 at 0x55, bq27541=1) still does not acknowledge: both candidate buses were scanned in both orders, with the wake bursts the datasheet asks for before every probe, and the pack is verifiably on (VBAT 4.28 V, so not ship-mode) — notes/battery-bus.md §4 keeps one hypothesis open, the pull-ups. The probe only runs when the SMB5 thread asks, which is why smb5=1 belongs in the boot arguments
	status      haptic      works     the motor is an Awinic AW8697, not the PM8150B's HAPC block: the overlay puts it on qupv3_se7 at I2C 0x5a with reset on gpio116 and its interrupt on gpio24 (dtbo.bin.01.dts fragment@51; vendor-src/haptic/aw8697.c is the vendor's driver). The HAPC answers and takes the device tree's recipe, but nothing is wired to it. drivers/haptic/hakios.aw8697.c moves gpio98/99 by hand (the engine's wrapper never starts a command on this phone), resets the chip, identifies it at 0x5a, and plays the vendor's continuous mode: play mode CONT, f0 170 Hz, the 0815 drive level 60, 0x9a delay, 0x0ff1 zero-cross threshold, BEMF and GO. The motor buzzes (aw8697=2 leaves it playing, aw8697=3 stops it) and an ear confirmed it. The RTP waveforms the vendor uses for touch feedback are not needed for this
	status      torch       partial   the PM8150L's flash LED module answers over the same arbiter (slave 5 0xd300, channel 333, type 0x18 subtype 0x4; the chip's own revid block reads 51 27 00 00), and the vendor driver's torch on-sequence runs: 300 mA at the 12.5 mA step, module and channel enable, every register read back as written, and the fault registers show no short or open circuit — the LED is wired and conducting (flash=2, logs/092331-run.log). The LED on channel 0 stays dark with every register read back as written, while all three channels together light the flashlight (the eye confirmed it), so the torch drives all three: `flash=3` leaves it lit and `flash=4` forces it off (logs/191722-run.log, logs/205931-run.log). This is the flashlight, not the panel's backlight: the WLED module does not drive this retail panel (notes/remaining-hardware.md)
	status      bluetooth   partial   the WCN3990 answers on the polled GENI UART at 115200 after the 2400-baud power pulses: product 0xa, soc 0x40010224, rom 0x1001, patch 0x6699, and a matched HCI Reset (opcode 0x0c03, status 0) (logs/170112-run.log). The TLV patch path now runs from the image's /fw: crbtfw21.tlv (product 0x0a, header type 1, 177060 bytes) is sent in 729 segments of 243 bytes, the ROM's per-command Command Completes are drained between segments, and the last segment is acknowledged; the version read after it reports soc 0x40010214, rom 0x201, patch 0x2 -- rom 0x201 decodes to 0x21, the file's own number -- and HCI Reset then matches again (logs/181027-run.log). The NVM is in too: crnv21.bin's tag headers are 12 bytes (the vendor's btqca.c advances by 2+2+8+len, not the 4 the newer upstream uses), and its tag 17 (HCI) asks for baud code 0x11 -- QCA_BAUDRATE_3200000, which is what silenced the controller as soon as the NVM applied. The driver now copies the file, writes 0 (115200) into that byte, and sends it: 19 segments, 19 acknowledged, and the controller still answers afterwards (soc 0x40010214, rom 0x201, patch 0x2) with HCI Reset matched (logs/205327-run.log). Scanning, pairing and the system Bluetooth service are unverified
	status      camera      partial   the register-level bring-up is verified on the phone: cam=1 reads the sensor table, GCC's camera clocks, the titan top GDSC, all four MCLK roots, every camera pin and the three PMIC GPIOs, and PM8008 #2's seven LDOs; cam=2 brings the rear main sensor up (PM8008 #2 revision ...01, LDO1 1100 mV, LDO7 2900 mV, LDO3 2800 mV, LDO4 1800 mV, MCLK0 19.200 MHz on gpio13, out of reset) and powers it down cleanly (logs/164351-run.log, logs/164459-run.log). The CCI bus stayed dead because the sensors' cam_vio was missing: the overlay points all five at pm8150l_l1 (dtbo.bin.01.dts:8133), an XOB regulator with no voltage register and no qcom,init-enable (android-merged.dts:12773-12785), so it needs an enable vote, not a millivolt vote. With that vote the main sensor answers on CCI0 at 0x1a: chip ID 0x0586 at 0x0016, the module EEPROM at 0x50 (16-bit read starts 05 00 19 09 14 13 56 00), and the actuator/OIS at 0x72/0x73 (logs/172606-run.log). cam=4 then powered all five in turn and four identified themselves with the expected ID: ultra-wide IMX319 0x0319 at 0x10 on CCI0 master1 (EEPROM 0x51), front IMX471 0x0471 at 0x10 on CCI1 master1 (EEPROM 0x54), telephoto S5K3M5 0x30d5 at 0x2d on CCI1 master0 (EEPROM 0x50, actuator 0x58), each powered down cleanly (logs/173026-run.log). The mono was the last one: it shares gpio29 with the front module, and with that pin low it answers at 0x37 with 0x02d0 at its 8-bit register 0xf0 -- a GalaxyCore two-megapixel part, not the OmniVision the first table guessed. The driver now drives gpio29 low for the mono by itself, so one cam=4 round identifies all five (main, ultra-wide, front, tele, mono) and powers each down cleanly (logs/182953-run.log, logs/183829-run.log). The CSIPHY/CSID/IFE path and any actual capture are unverified
	status      touch       partial   the S3706 answers through bit-banged pads (gpio56 SCL, gpio55 SDA; the qup2 engine cannot start), its enable is PM8150L GPIO 5 driven high; the F01 status at 0x06 marks reports by its bit 2 and the five bytes at 0x08 are [count, x lo, x hi, y lo, y hi] in the panel's own 1079x2399 coordinates. The half-period is spun against the timebase, not slept: sleep_us() parks the thread for a scheduler tick (7.5 ms), and with seven processors the stretched five-byte read answered 00 00 00 00 00 on every interrupt while one processor read contacts (logs/204724-run.log against logs/210105-run.log). With the spin the object read takes 2388 us and the round posted 37 downs, 118 moves and 36 ups with zero failed reads on seven processors (logs/210849-run.log); the chip's interrupt line gpio122 (low while it asks) now sets the pace, a one-millisecond pin poll with a 150 ms heartbeat, so a tap is taken within a tick instead of waiting for the idle read. backboardd receives it all (touch=1). What is left is the experience test, not the driver: the UI is still drawn in software at 1080x2400 (notes/cpu.md), so a drag or home gesture is limited by the frame rate even when every contact arrives. The driver is built (CONFIG_HAKIOS_S3706=y) AND enabled by default in CONFIG_BOOTARGS (touch=1), and it now goes straight to the pads: trying the QUP engine first cost the boot the engine's three attempts and two long waits (one 30 s), so the screen was dead for about a minute and a half after every boot -- taps at 19:19:08 in a 19:17:35 boot, logs/191722-run.log. With `touch_bb` (the default; touch_bb=0 restores the old order) the event loop is up within seconds of the boot and the round at 19:29 took 14 contacts (logs/192945-run.log). iOS receives them: backboardd logs `[TouchEvents] contact 1 presence: touching` and `none` for each (logs/191722-run.log). The "works, then stops" was two things: SpringBoard's idle timer putting the display to sleep (the panel's backlight is the boot firmware's, so the glass stayed lit while every touch became wake-on-touch and was swallowed -- the injected library now keeps the idle timer off and no longer swallows the waking tap), and the chip's own F01 doze registers (00 7f 08 14 as found): the driver now writes normal operation with the doze interval and timer at 0, once at the start and on every five-second heartbeat. Seven minutes of continuous use held: 319 downs, 2983 moves, 319 ups, 0 reads failed (logs/200228-run.log)
	status      wifi        partial   M1 is through on the phone: the command database names all six resources (ldoa1 0x40800, ldoa7 0x41f00, ldoc2 0x41d00, ldoc11 0x41a00, lcx.lvl 0x30030, lmx.lvl 0x30040), the four VRM rails took all twelve TCS votes at the device tree's own voltages, and the boot ran untouched to the 200 s return (logs/095951-run.log). The Q6 block at 0x5c00000 answered the only way an unpowered subsystem can: the first read never came back and the kernel hung there (logs/095451-run.log), so the block is read only with slpi=3, after M2 starts the subsystem. The step that needs no hardware is done: the BSD stack answers its own loopback on this phone, net_test loop connecting in 0.02 s and reading its three bytes back (logs/001019-run.log line 1177, repeated in logs/002328-run.log.live.32). The firmware blocker is gone too: the EDL backup's modem volume carries the whole SLPI image — slpi.mdt, slpi.b00–b20, bdwlan.bin and its segments — extracted to fw-wifi (notes/wifi.md §8 item 4). M2 is through as far as the image goes: with slpi=3 the QMP mailbox to the always-on processor opens, the AOP takes "off" and "on", the two ARC supplies are voted at the ssc node's level 0x181, and TrustZone accepts the signature, takes the 20 MiB region, sees all twenty segments read back and returns success from PAS_AUTH_AND_RESET (logs/124242-run.log). What the phone then said, over four rounds, is that the subsystem is not coming up on the image path at all: the q6 block at 0x5c00000 still does not answer after the authentication, and the slpi's SMP2P item keeps its valid_entries at zero. M3 is in and answered: the outbound smp2p item 430 is allocated in the (0,3) partition the way the vendor's allocator does it (entry header at partition + free_uncached, size rounded up to eight, free_uncached 0x20 -> 0x188, free_cached untouched) and written with the vendor's contents (version 1, features 1, local 0, remote 3, 2 of 16 entries, "master-kernel" then "sleepstate", both values zero), and the doorbell at 0x17c0000c bit 0x1a is rung before the start and again when the slpi's entries appear (logs/031835-run.log). The same run settles the earlier reading: a full reset rebuilds SMEM (no items at all, free_uncached 0x20), and with that clean slate the slpi's own item 481 never appears within 30 s — so the 481 with valid_entries 0 that earlier rounds watched was Android's slpi boot, and our own slpi start has never written it. Two things fell out of being the question: the q6 block at 0x5c00000 (neither the vendor's driver nor mainline reads it for this subsystem, and reading it while the slpi is up stalls the thread and cost one run its shutdown, logs/030641-run.log — it is read only when the start failed), and the AOP signal (qcom,signal-aop is the load_state message over the qmp-aop mailbox we already speak: the ssc node's mboxes = <0x1f 0x00> "slpi-pil" with 0x1f the qcom,qmp-aop@c300000 node, and pil_notify_aop() sends exactly that text as pil_boot()'s first act, peripheral-loader.c:1238-1253, :1358). slpi=6 runs the vendor's order with M3, and logs/033426-run.log produced the first sign of the slpi itself: with the AOP told, the slpi's own item 481 appeared at smem+0x17f198 with valid_entries 0 to 3 — "smp2p", "slave-kernel", "sleepstate_see", all values 0 — so its smp2p driver registered and is alive. logs/035630-run.log settled what separates the rounds: nothing does — the slpi boots, its kernel runs, its smp2p driver registers its three entries, and its glink edge allocates five more shared-memory items beside them (478, 480, 608, 611, 613, none with printable text, which is where a glink edge keeps its version exchange and its ring) — minutes after TrustZone releases the reset, so every earlier "it never appeared" was a watch that gave up too early, the aop message is not the gate, and the warm-q6 re-vote is moot and is gone. What no round produces is the "slave-kernel" ready bit (bit 1), even with the entries up and the vote taken twice in one round: the slpi's glink edge has no host-side counterpart to open against, and that is M4, the host-side glink edge, which drivers/wifi/hakios.wifi.c already opens for redwood's wpss. The slpi's sfr item 424 says what its boot does meanwhile: one continuous ascii string, "SFR Init: wdog or kernel error suspected.", a hexagon subsystem restart's reason for a watchdog bite or a kernel fault — its first boot watches something time out and its restarted one gets further. The watch now ends with the sfr item read as text first, because the hexagon firmware writes a tagged string and not the vendor's struct, and the partition's items listed with their printable text and their first 64 bytes in hex, because a glink version structure is binary and a text pass alone calls it empty (notes/wifi.md §5) M3b, the read of the image's own memory, failed as an observation and is behind slpi=7 now: after PAS auth the region belongs to the subsystem's domain, its first word never read back while the slpi ran, and the run lost its shutdown over it (psci: cpu 4 cannot return, boot processor does not answer); the vendor reads that region only with the subsystem stopped. What the watch now ends with instead are the two reads that cannot end a run, both plain SMEM: the slpi's SFR item 424 (the ssc node's qcom,smem-id, the reason string the vendor's get_failure_reason() reads) and every item of the shared partition with any printable text inside it — the closest thing to the slpi's console without a ramdump channel (notes/wifi.md §5). M4, the host side of the slpi's glink edge, is in the driver behind slpi=8: item 479 allocated through the M3 allocator (it persists in shared memory across our restarts, so a later slpi instance finds it at probe), the version exchange, the channel, the intents, and a polled wait — the edge's GIC SPI 0xaa is not taken. The slpi's side is proven alive: a fresh instance built its edge minutes after its reset and wrote its VERSION into item 480 at probe time (logs/044710-run.log). What has never happened is the other side reading our queue: the first doorbell was wrong (zero to 0x17c00060), and the vendor's apcs semantics — BIT(0x18) at 0x17c0000c, the offset-12 register its qcom-apcs-ipc-mailbox.c rings for that DT cell — has rung five times with our_tail still zero (logs/045335-run.log). The decisive pair ran (logs/050214 + logs/051227): the new instance's glink init rewrote the descriptor's marks (their_head 8 to 0) and wrote its version at offset 0 of its queue but never moved its head to announce it and never read our queue, and our reader mistook that reset for a wrap and filled our queue with 2,047 phantom zero-messages. The reader now stops at all-zero messages and realigns to the other side's reset. slpi=9 ran (logs/053241-run.log) and its sentinel survived 480 s, but reading the logs side by side invalidated that: the sentinel went in after the instance's glink init had already run and passed. The instance comparison is what settles the behaviour: the one logs/043646-run.log started, which found the descriptor all zeroes and its queue empty, is the only instance that ever announced its version; the ones that found an old version message at offset 0 reset the fifo and wrote nothing of their own (the message 051227 read was the earlier instance's), and no instance has ever read our queue — our_tail has read 0 in every log. The one variable is the edge's state at the reset, and slpi=10 is that experiment: slpi_glink_clean() zeroes the descriptor and both queues inside slpi_start(), between the AOP's off and the auth-and-reset, and slpi_glink_watch_announce() reads the zeroed their_head from the reset itself, no sentinel and no race. It ran the same morning (logs/060328-run.log, peak 42.4 °C) and the model held in full: the instance announced on the watch's first poll — under a second after its reset, so the 60 s and 35 s the earlier logs seemed to show were only the moments our own scans looked — it wrote its version at offset 0 and moved its own head to 8, we read it and answered it, and our_tail still never moved with bit 0x18 of 0x17c0000c rung at the announcement and five times after. The doorbell is exonerated under every condition: the instance's glink driver has no working rx. Reading that rx out of the firmware closed itself off: the .mdt has no section headers and is pre-relocated, and the one code-segment hit was an import-table record, not code (notes/wifi.md §5). M11 asked the smp2p side instead, with the protocol's own ping — restart-done in our item's flags, bit 0x1a, watch the SLPI's item flags for the restart-ack — and nothing answered in 45 s and two rings (logs/065342-run.log); but the run read item 481's flags for the first time and they read 0x1, the SLPI's own restart-done sitting there unanswered: its smp2p driver is alive, its interrupt handler never ran. M12 read the doorbell block back after the same ping: the bits are self-clearing pulses, no latched witness either way (logs/071531-run.log). The vendor's smp2p source then closed the protocol side: the AP never writes restart-done in its out item — bit 0 is only read from in->flags (check_ssr, smp2p.c:197-224) and the only flags write is do_ssr_ack's bit 1 — so M11's ping was already the maximal correct provocation and our item 430 is already vendor-correct. M13 asked the opposite direction instead, and the devicetree names the two lines: the glink edge dsps has interrupts = <0x00 0xaa 0x01> = SPI 170 (android-merged.dts:4106) and smp2p-dsps has <0x00 0xac 0x01> = SPI 172 (:16769). A masked edge SPI latches in GICD_ICPENDR and stays, so one read of the distributor's word for 160-191 answers for every ring since boot. slpi=13 read it before, at the announcement (item 481's flags 0x1 confirmed as the smp2p ring's witness), and at the end of a fresh slpi=10-style start: pending 0, enabled 0, type 0 all three times — both lines sit at the GIC's reset state, level, because our kernel never programs ICFGR for a line it does not attach; a level line samples a pulse and keeps nothing, so that silence proves nothing, exactly as the design said (logs/074524-run.log). M14 sets both type fields to edge, what the DT says they are — allowed while the lines are disabled, and read back, because a non-secure write to a secure interrupt's config is ignored — and asks the pending question again: a pending bit means the SLPI-to-AP half works and only AP-to-SLPI is dead; a level readback means the lines are secure and the question needs the secure world; edge set and nothing pending means the rings never reached us either and the difference is the AOP bring-up. M14 ran (logs/075618-run.log): the write read back all zeros, the announcement came at 0 s again with 481 flags 0x1, and the direct reads stayed zeros throughout. The run read that as secure interrupts, but the vendor's own pinctrl-msm.c shows the plainer cause: it programs these same GIC SPI type bits through scm_io_read/scm_io_write, the SCM IO service 0x05 read 0x01 write 0x02, because on these SoCs the distributor is a register set the non-secure world may not touch — and then every direct read of ours returned a zero, not a state, and M13's level finding was not a state either. M15 asks the whole question through the owner: the firmware's reads of ICPENDR/ISENABLER/ICFGR before, at the announcement, and at the end of the same fresh-instance sequence, and the type set through the firmware if its read shows a word our mapping said was zeros (notes/wifi.md §5)
	status      thermal     works     all 28 TM-Sense sensors read every 5 s with thermal_pclm10=1 (every GPU round shows "28 of 28 sensors read"), and thermal_stop=60 ends a round before anything gets hot. The heat itself was quantified with rc.jobs.cpuprof, five ps snapshots twenty seconds apart: lsd spends about 70% of a core for its first 30 s and ~41 s in total because the LaunchServices store is missing and 662 containers are created fresh every boot (logs/020628-run.log, logs/020952-run.log) — one-time first-boot work, its TIME freezes by t≈116 s, not a loop; the container UUIDs are random every boot (InternalDaemon/BEE7B133-... against 32FB1AB3-...), so only a persistent /var removes it, not a prebaked store. The steady-state cost was the idle path: with no sleepd, once the display blanks at ~90 s SpringBoard asks launchd for com.apple.sleepd.sleepserver and com.apple.chronod about a thousand times a second, launchd at 43% of a core and climbing (logs/020952-run.log); with com.apple.sleepd and com.apple.chronod in the default job set both start on demand and the storm is gone — zero failed lookups for that name, launchd's last-20 s cost 8.65 s down to 3.78 s, hottest 44.8 C (logs/022040-run.log). What is not verified: the sensors' absolute accuracy, anything the pack would say (bq27541 still does not acknowledge), and true steady idle — minutes of quiescence need a persistent /var to mean anything (notes/remaining-hardware.md, 2026-11-05)
